services:
  jellyfin:
    build:
      context: .
      dockerfile: Dockerfile.local
      additional_contexts:
        web: ../media-server-frontend
    image: jellyfin-local:dev
    init: true
    ports:
      - "8096:8096/tcp"
      - "7359:7359/udp"
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ./media:/media:ro
    restart: unless-stopped

volumes:
  jellyfin-config:
  jellyfin-cache:
